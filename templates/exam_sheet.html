<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Варақаи имтиҳонсупорӣ — {{ s.id }}</title>
  <style>
    @page { size: A4; margin: 12mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #0a3328;
      background: #e8f0eb;
      font-size: 13px;
    }
    .toolbar {
      display: flex; gap: 8px; justify-content: center; padding: 10px;
    }
    .toolbar button {
      border: 0; background: #0f4d3a; color: #fff;
      padding: 9px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;
    }
    .hint { text-align: center; font-size: 11px; color: #5a7a6e; margin-bottom: 8px; }
    .header {
      max-width: 186mm; margin: 0 auto; background: #fff;
      border: 1.5px solid #0a3328; border-radius: 6px; overflow: hidden;
    }
    .title {
      background: linear-gradient(135deg, #0a3328, #157a58);
      color: #fff; text-align: center; font-weight: 800;
      font-size: 0.88rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 7px 10px;
    }
    .row { display: flex; align-items: stretch; }
    .info {
      flex: 1; display: grid;
      grid-template-columns: 1.4fr 1.2fr 0.55fr 1.1fr;
    }
    .cell {
      padding: 8px 10px; border-right: 1px solid #d4e5db; background: #fafdfb;
    }
    .cell:last-child { border-right: 0; }
    .label {
      display: block; font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: #5a7a6e; font-weight: 700; margin-bottom: 2px;
    }
    .value { font-weight: 700; font-size: 0.88rem; color: #0a3328; word-break: break-word; }
    .value.mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; }
    .value.subject { color: #0f4d3a; }
    .qr-box {
      width: 120px; flex-shrink: 0; border-left: 1px solid #d4e5db;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 6px; background: #fff;
    }
    .qr-box img, .qr-box canvas {
      width: 96px !important; height: 96px !important; display: block;
    }
    #qrcode { width: 96px; height: 96px; }
    .qr-box .ql {
      font-size: 0.62rem; color: #5a7a6e; font-weight: 700; margin-top: 4px; text-align: center;
    }
    @media print {
      body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .toolbar, .hint, .no-print { display: none !important; }
      .header { max-width: none; margin: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <button type="button" onclick="window.print()">🖨 Чоп / Save as PDF</button>
    <button type="button" onclick="window.close()">Пӯшидан</button>
  </div>
  <p class="hint no-print">Чоп: A4 · Headers/footers хомӯш · QR = ID</p>

  <div class="header">
    <div class="title">Варақаи имтиҳонсупорӣ</div>
    <div class="row">
      <div class="info">
        <div class="cell">
          <span class="label">ID-и иштирокчӣ</span>
          <span class="value mono">{{ s.id }}</span>
        </div>
        <div class="cell">
          <span class="label">Фанни имтиҳонсупорӣ</span>
          <span class="value subject">{{ s.subject }}</span>
        </div>
        <div class="cell">
          <span class="label">Синф</span>
          <span class="value">{{ s.class_name }}</span>
        </div>
        <div class="cell">
          <span class="label">Намуди олимпиада</span>
          <span class="value">{{ s.olympiad_title or '—' }}</span>
        </div>
      </div>
      <div class="qr-box">
        {% if qr_uri %}
        <img src="{{ qr_uri }}" alt="QR" width="96" height="96"/>
        {% else %}
        <div id="qrcode"></div>
        {% endif %}
        <div class="ql">QR · ID</div>
      </div>
    </div>
  </div>

  {% if not qr_uri %}
  <script>
  (function () {
    var id = {{ s.id|tojson }};
    function draw() {
      var el = document.getElementById("qrcode");
      if (!el || typeof QRCode === "undefined") return;
      el.innerHTML = "";
      new QRCode(el, {
        text: String(id),
        width: 96,
        height: 96,
        colorDark: "#0a3328",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }
    function loadScript(src, next) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = next;
      s.onerror = function () { if (next) next(true); };
      document.body.appendChild(s);
    }
    if (typeof QRCode !== "undefined") { draw(); return; }
    loadScript("/static/js/vendor/qrcode.min.js", function (err) {
      if (!err && typeof QRCode !== "undefined") { draw(); return; }
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js", function () {
        draw();
      });
    });
  })();
  </script>
  {% endif %}
</body>
</html>
