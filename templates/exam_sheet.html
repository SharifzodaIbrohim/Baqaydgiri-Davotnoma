<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Варақаи имтиҳонсупорӣ — {{ s.id }}</title>
  <style>
    @page { size: A4; margin: 12mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #0a3328;
      background: #fff;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 10px;
      background: #f0f7f3;
    }
    .toolbar button {
      border: 0;
      background: #0f4d3a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    @media print {
      .toolbar { display: none !important; }
      body { background: #fff; }
    }
    .sheet {
      max-width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 8mm 10mm;
      display: flex;
      flex-direction: column;
    }
    .header {
      border: 2px solid #0a3328;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #f7fbf9, #fff);
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      align-items: baseline;
      font-size: 13px;
    }
    .header-row .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5a7a6e;
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }
    .header-row .value {
      font-weight: 700;
      font-size: 14px;
      font-family: ui-monospace, Consolas, monospace;
    }
    .header-row .value.subject {
      font-family: inherit;
      color: #0f4d3a;
      font-size: 15px;
    }
    .title {
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #0a3328;
      margin: 0 0 8px;
      text-transform: uppercase;
    }
    .blank {
      flex: 1;
      border: 1.5px dashed #c5d5cc;
      border-radius: 4px;
      min-height: 220mm;
      /* completely empty — admin prints questions here */
    }
    .footer-note {
      margin-top: 8px;
      font-size: 10px;
      color: #8aa397;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <button type="button" onclick="window.print()">🖨 Чоп / Save as PDF</button>
    <button type="button" onclick="window.close()">Пӯшидан</button>
  </div>

  <div class="sheet">
    <div class="header">
      <p class="title">Варақаи имтиҳонсупорӣ</p>
      <div class="header-row">
        <div>
          <span class="label">ID-и иштирокчӣ</span>
          <span class="value">{{ s.id }}</span>
        </div>
        <div>
          <span class="label">Фанни имтиҳонсупорӣ</span>
          <span class="value subject">{{ s.subject }}</span>
        </div>
        <div>
          <span class="label">Синф</span>
          <span class="value">{{ s.class_name }}</span>
        </div>
        <div>
          <span class="label">Намуди олимпиада</span>
          <span class="value">{{ s.olympiad_title or '—' }}</span>
        </div>
      </div>
    </div>

    <!-- ПОЁНИ ВАРАҚ — ТАМОМАН ХОЛӢ барои чопи саволҳо -->
    <div class="blank"></div>
    <p class="footer-note">Майдони холӣ барои саволнома / тест</p>
  </div>
</body>
</html>
